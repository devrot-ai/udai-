services:
  api:
    build:
      context: .
      args:
        FULL: "${FULL:-0}"   # FULL=1 docker compose up --build  → full ML stack
    ports:
      - "8000:8000"
    volumes:
      - docintel-data:/app/data
    environment:
      - DOCINTEL_DATA_DIR=/app/data
      - DOCINTEL_DATABASE_URL=sqlite:////app/data/docintel.db
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}   # optional LLM answers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  docintel-data:
